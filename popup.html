<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CR Toolkit</title>
<style>
:root {
    color-scheme: dark;
    --accent: #ff6f00;
    --accent-soft: rgba(255, 111, 0, 0.14);
    --background: #272727;
    --border: rgba(255, 255, 255, 0.11);
    --text: #f2f1ed;
    --muted: #a7abb3;
}

* {
    box-sizing: border-box;
}

html {
    width: 360px;
    height: 300px;
    margin: 0;
}

body {
    width: 100%;
    height: 100%;
    margin: 0;
}

body {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0;
    overflow: hidden;
    background: var(--background);
    color: var(--text);
    font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
}

.info-card {
    position: relative;
    display: flex;
    width: 100%;
    height: 100%;
    min-height: 0;
    align-items: center;
    flex-direction: column;
    justify-content: center;
    gap: 10px;
    padding: 16px;
    text-align: center;
}

.logo {
    display: block;
    width: 176px;
    height: auto;
    margin-bottom: 3px;
}

.info-text {
    max-width: 270px;
    margin: 0;
    color: var(--muted);
    font-size: 11px;
    line-height: 1.55;
}

.github-link {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    padding: 7px 11px;
    border: 1px solid rgba(255, 111, 0, 0.26);
    border-radius: 10px;
    background: var(--accent-soft);
    color: var(--accent);
    font-size: 10px;
    font-weight: 650;
    text-decoration: none;
    transition: background 0.2s ease, border-color 0.2s ease, color 0.2s ease, transform 0.2s ease;
}

.github-link:hover {
    border-color: rgba(239, 138, 93, 0.46);
    background: rgba(239, 138, 93, 0.2);
    color: #ffad79;
}

.github-link:active {
    transform: scale(0.98);
}

.footer {
    position: static;
    margin-top: 6px;
    color: #a7abb3;
    font-size: 10px;
    text-align: center;
}

.footer a {
    color: #ff6f00;
    text-decoration: none;
}

.footer a:hover {
    color: #ffad79;
}
</style>
</head>
<body>
    <main class="info-card">
        <img class="logo" src="icon.png" alt="CR Toolkit">
        <p class="info-text">
            Open the gear in Crunchyroll's header actions to access all settings directly on the page.
        </p>
        <a class="github-link" href="https://github.com/darkplugins/cr-toolkit" target="_blank" rel="noopener noreferrer">
            View project on GitHub ↗
        </a>
        <footer class="footer">
            Made with ❤️ by
            <a href="https://darkplugins.de" target="_blank" rel="noopener noreferrer">DarkPlugins</a>
        </footer>
    </main>
</body>
</html>
